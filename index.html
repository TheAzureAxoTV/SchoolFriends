<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#313338" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>SchoolFriends | SocialChat</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --app-height: 100dvh; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
      overscroll-behavior-y: none;
      background: #313338;
      color: #dbdee1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; }
    input, textarea, select { font-size: 16px !important; }
    button { border: 0; }
    #root { width: 100%; height: 100%; }
    .app { display:flex; width:100%; height:100%; overflow:hidden; position:relative; background:#313338; }
    .sidebar {
      width:288px; height:100%; flex:0 0 288px; background:#2b2d31;
      border-right:1px solid rgba(0,0,0,.2); display:flex; flex-direction:column;
      z-index:50; transition:transform .3s ease;
    }
    .server-header {
      height:56px; padding:0 16px; border-bottom:1px solid rgba(0,0,0,.2);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
      color:#fff; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.15);
    }
    .brand { display:flex; align-items:center; gap:8px; }
    .brand i { color:#818cf8; }
    .close-btn { display:none; color:#949ba4; background:transparent; padding:6px; }
    .channel-list { flex:1; overflow-y:auto; padding:8px; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
    .section-label { padding:0 8px 4px; margin-bottom:4px; color:#949ba4; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    .channel {
      width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; margin:2px 0;
      border-radius:6px; background:transparent; color:#949ba4; cursor:pointer; text-align:left;
      font-size:14px; font-weight:600;
    }
    .channel:hover { background:#35373c; color:#dbdee1; }
    .channel.active { background:#404249; color:#fff; }
    .user-footer { background:#1e1f22; padding:8px; display:flex; align-items:center; }
    .user { display:flex; align-items:center; gap:8px; padding:0 4px; }
    .avatar { width:40px; height:40px; border-radius:50%; background:#475569; flex:0 0 auto; }
    .avatar.small { width:32px; height:32px; }
    .username { color:#fff; font-size:12px; font-weight:700; line-height:1.1; }
    .tag { color:#949ba4; font-size:10px; margin-top:2px; }

    .main { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; background:#313338; }
    .header {
      height:56px; flex:0 0 56px; padding:0 16px; display:flex; align-items:center; gap:12px;
      border-bottom:1px solid rgba(0,0,0,.2); box-shadow:0 1px 2px rgba(0,0,0,.15); z-index:10;
    }
    .menu-btn { display:none; background:transparent; color:#949ba4; padding:6px; cursor:pointer; }
    .channel-title { display:flex; align-items:center; gap:8px; color:#fff; font-weight:700; }
    .hash { color:#949ba4; font-size:21px; }
    .messages {
      flex:1; min-height:0; overflow-y:auto; padding:16px; overscroll-behavior-y:contain;
      -webkit-overflow-scrolling:touch;
    }
    .message { display:flex; align-items:flex-start; gap:12px; margin:4px 0; padding:4px; border-radius:6px; }
    .message:hover { background:rgba(0,0,0,.1); }
    .message-body { flex:1; min-width:0; }
    .meta { display:flex; align-items:baseline; gap:8px; }
    .msg-user { color:#fff; font-size:14px; font-weight:700; }
    .timestamp { color:#949ba4; font-size:10px; }
    .msg-text { color:#dbdee1; font-size:14px; line-height:1.45; margin-top:2px; overflow-wrap:anywhere; }
    .composer-wrap {
      flex:0 0 auto; padding:12px; background:#313338; border-top:1px solid rgba(0,0,0,.1);
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .composer {
      display:flex; align-items:center; gap:8px; padding:8px 12px; background:#2b2d31;
      border:1px solid transparent; border-radius:8px;
    }
    .composer:focus-within { border-color:rgba(99,102,241,.5); }
    .composer input {
      width:100%; min-width:0; border:0; outline:0; background:transparent;
      color:#dbdee1; padding:4px 0; font-size:16px;
    }
    .composer input::placeholder { color:#949ba4; }
    .send { color:#818cf8; background:transparent; padding:4px; cursor:pointer; }
    .send:hover { color:#a5b4fc; }
    .backdrop { display:none; }

    @media (max-width: 767px) {
      .sidebar {
        position:fixed; left:0; top:0; transform:translateX(-100%);
        box-shadow:8px 0 24px rgba(0,0,0,.35);
      }
      .sidebar.open { transform:translateX(0); }
      .close-btn { display:block; }
      .menu-btn { display:block; }
      .backdrop {
        position:fixed; inset:0; display:block; background:rgba(0,0,0,.6);
        z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;
      }
      .backdrop.open { opacity:1; pointer-events:auto; }
      .message { margin-left:-4px; margin-right:-4px; }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    (() => {
      const root = document.getElementById("root");
      const channels = [
        { id: "general", name: "general", icon: "hashtag" },
        { id: "homework", name: "homework", icon: "book" },
        { id: "announcements", name: "announcements", icon: "bullhorn" }
      ];

      const avatar = seed =>
        "https://api.dicebear.com/7.x/bottts/svg?seed=" + encodeURIComponent(seed);

      let activeChannel = channels[0];
      let sidebarOpen = false;
      const messages = [
        { id:"1", user:"Alex", avatar:avatar("Alex"), text:"Hey everyone! Welcome to SchoolFriends.", timestamp:"10:42 AM" },
        { id:"2", user:"Sarah", avatar:avatar("Sarah"), text:"Is the math assignment due tomorrow or Friday?", timestamp:"10:44 AM" }
      ];

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, c => ({
          "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
        }[c]));
      }

      function render() {
        root.innerHTML = `
          <div class="app">
            <div class="backdrop ${sidebarOpen ? "open" : ""}" id="backdrop"></div>

            <aside class="sidebar ${sidebarOpen ? "open" : ""}" id="sidebar">
              <div class="server-header">
                <div class="brand">
                  <i class="fa-solid fa-graduation-cap"></i>
                  <span>SchoolFriends</span>
                </div>
                <button class="close-btn" id="closeSidebar" aria-label="Close Channels">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <div class="channel-list">
                <div class="section-label">Text Channels</div>
                ${channels.map(c => `
                  <button class="channel ${activeChannel.id === c.id ? "active" : ""}" data-channel="${c.id}">
                    <i class="fa-solid fa-${c.icon}"></i>
                    <span>${escapeHtml(c.name)}</span>
                  </button>
                `).join("")}
              </div>

              <div class="user-footer">
                <div class="user">
                  <img class="avatar small" src="${avatar("You")}" alt="Avatar">
                  <div>
                    <div class="username">You</div>
                    <div class="tag">#0001</div>
                  </div>
                </div>
              </div>
            </aside>

            <main class="main">
              <header class="header">
                <button class="menu-btn" id="openSidebar" aria-label="Open Channels">
                  <i class="fa-solid fa-bars"></i>
                </button>
                <div class="channel-title">
                  <span class="hash">#</span>
                  <span>${escapeHtml(activeChannel.name)}</span>
                </div>
              </header>

              <div class="messages" id="messages">
                ${messages.map(m => `
                  <div class="message">
                    <img class="avatar" src="${m.avatar}" alt="${escapeHtml(m.user)}">
                    <div class="message-body">
                      <div class="meta">
                        <span class="msg-user">${escapeHtml(m.user)}</span>
                        <span class="timestamp">${escapeHtml(m.timestamp)}</span>
                      </div>
                      <div class="msg-text">${escapeHtml(m.text)}</div>
                    </div>
                  </div>
                `).join("")}
                <div id="messagesEnd"></div>
              </div>

              <footer class="composer-wrap">
                <form class="composer" id="messageForm">
                  <input id="messageInput" type="text" autocomplete="off"
                         placeholder="Message #${escapeHtml(activeChannel.name)}">
                  <button class="send" type="submit" aria-label="Send message">
                    <i class="fa-solid fa-paper-plane"></i>
                  </button>
                </form>
              </footer>
            </main>
          </div>
        `;

        document.querySelectorAll("[data-channel]").forEach(button => {
          button.addEventListener("click", () => {
            activeChannel = channels.find(c => c.id === button.dataset.channel) || channels[0];
            sidebarOpen = false;
            render();
          });
        });

        document.getElementById("openSidebar").addEventListener("click", () => {
          sidebarOpen = true;
          render();
        });
        document.getElementById("closeSidebar").addEventListener("click", () => {
          sidebarOpen = false;
          render();
        });
        document.getElementById("backdrop").addEventListener("click", () => {
          sidebarOpen = false;
          render();
        });

        document.getElementById("messageForm").addEventListener("submit", e => {
          e.preventDefault();
          const input = document.getElementById("messageInput");
          const text = input.value.trim();
          if (!text) return;

          const now = new Date().toLocaleTimeString([], {
            hour: "2-digit", minute: "2-digit"
          });
          messages.push({
            id: String(Date.now()),
            user: "You",
            avatar: avatar("You"),
            text,
            timestamp: now
          });
          render();
          const box = document.getElementById("messages");
          box.scrollTop = box.scrollHeight;
          document.getElementById("messageInput").focus();
        });

        requestAnimationFrame(() => {
          const box = document.getElementById("messages");
          if (box) box.scrollTop = box.scrollHeight;
        });
      }

      function setAppHeight() {
        const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty("--app-height", height + "px");
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", setAppHeight);
        window.visualViewport.addEventListener("scroll", setAppHeight);
      } else {
        window.addEventListener("resize", setAppHeight);
      }

      setAppHeight();
      render();
    })();
  </script>
</body>
</html>
