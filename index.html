<!DOCTYPE html>
<html lang="en" class="h-full bg-[#1e1f22] text-[#dbdee1] antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SchoolFriends - student community chat">
  <title>SchoolFriends | Chat Client</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT:"#5865f2", hover:"#4752c4", active:"#3c45a5", light:"#7983f5" },
            discord: {
              sidebar:"#2b2d31", chat:"#313338", rail:"#1e1f22", darkest:"#111214",
              input:"#383a40", hover:"#35373c", active:"#404249", muted:"#949ba4",
              subtle:"#80848e", green:"#23a55a", amber:"#f0b232", rose:"#f23f43"
            }
          },
          boxShadow: {
            "glow-brand":"0 0 15px rgba(88,101,242,.4)",
            "subtle-bar":"0 1px 2px rgba(0,0,0,.2)"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    html,body { height:100%; margin:0; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#1a1b1e; border-radius:9999px; }
    ::-webkit-scrollbar-thumb:hover { background:#111214; }
    .glass-header { background:rgba(49,51,56,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    @keyframes fadeInMsg { from {opacity:0;transform:translateY(6px)} to {opacity:1;transform:translateY(0)} }
    .animate-msg { animation:fadeInMsg .18s cubic-bezier(.16,1,.3,1) forwards; }
  </style>
</head>

<body class="h-full w-full flex overflow-hidden font-sans select-none bg-discord-rail text-discord-muted">
  <div id="mobileBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 hidden"></div>

  <div class="flex h-full w-full overflow-hidden">

    <!-- SERVER RAIL -->
    <aside class="w-[72px] bg-discord-rail flex flex-col items-center py-3 gap-2 shrink-0 border-r border-discord-sidebar/40 z-50">
      <button id="homeServerBtn" class="relative group cursor-pointer" title="SchoolFriends Server">
        <div id="activeServerPill" class="absolute -left-3 top-2.5 w-1.5 h-7 bg-brand rounded-r-full"></div>
        <div class="w-12 h-12 rounded-[24px] group-hover:rounded-[16px] bg-discord-sidebar overflow-hidden transition-all duration-200 border border-brand/30 shadow-lg group-hover:shadow-glow-brand flex items-center justify-center">
          <img src="https://api.dicebear.com/9.x/shapes/svg?seed=SchoolFriends" class="w-full h-full object-cover" alt="SchoolFriends logo">
        </div>
      </button>

      <div class="w-8 h-[2px] bg-discord-input/60 rounded-full my-1"></div>

      <button class="w-12 h-12 rounded-[24px] bg-discord-sidebar hover:bg-discord-green hover:rounded-[16px] flex items-center justify-center text-discord-green hover:text-white transition-all group" title="Add Server">
        <i class="fa-solid fa-plus text-lg group-hover:scale-110"></i>
      </button>

      <button class="w-12 h-12 rounded-[24px] bg-discord-sidebar hover:bg-brand hover:rounded-[16px] flex items-center justify-center text-discord-subtle hover:text-white transition-all group" title="Explore Community">
        <i class="fa-solid fa-compass text-lg group-hover:scale-110"></i>
      </button>

      <div class="mt-auto">
        <button id="openSettingsBtn" class="w-12 h-12 rounded-[24px] bg-discord-sidebar hover:bg-discord-hover hover:rounded-[16px] flex items-center justify-center text-discord-subtle hover:text-white transition-all" title="Settings">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </aside>

    <!-- CHANNEL SIDEBAR -->
    <aside id="channelSidebar" class="fixed sm:relative inset-y-0 left-[72px] sm:left-0 w-64 bg-discord-sidebar flex flex-col shrink-0 border-r border-discord-rail/80 z-40 transform -translate-x-full sm:translate-x-0 transition-transform duration-300 shadow-2xl sm:shadow-none">
      <header class="h-12 px-4 flex items-center justify-between border-b border-discord-rail/90 shadow-subtle-bar shrink-0">
        <h1 class="font-bold text-white text-sm tracking-wide flex items-center gap-2 truncate">
          <span class="truncate">SchoolFriends</span>
          <i class="fa-solid fa-circle-check text-xs text-brand"></i>
        </h1>
        <i class="fa-solid fa-chevron-down text-xs text-discord-muted"></i>
      </header>

      <div class="flex-1 overflow-y-auto p-2 space-y-1">
        <div class="flex items-center justify-between px-2 pt-3 pb-1 text-[11px] font-bold tracking-wider text-discord-subtle uppercase">
          <span><i class="fa-solid fa-chevron-down text-[9px] mr-1"></i>Text Channels</span>
          <i class="fa-solid fa-plus cursor-pointer hover:text-white" title="Create Channel"></i>
        </div>

        <button data-channel="general-chat" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md bg-discord-hover text-white font-medium text-xs">
          <i class="fa-solid fa-hashtag text-sm"></i><span>general-chat</span>
          <span class="ml-auto w-2 h-2 rounded-full bg-brand hidden" id="badge-general-chat"></span>
        </button>
        <button data-channel="announcements" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md hover:bg-discord-hover/50 text-discord-muted hover:text-white text-xs">
          <i class="fa-solid fa-bullhorn text-sm"></i><span>announcements</span>
        </button>
        <button data-channel="polls" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md hover:bg-discord-hover/50 text-discord-muted hover:text-white text-xs">
          <i class="fa-solid fa-square-poll-vertical text-sm"></i><span>polls</span>
        </button>
        <button data-channel="gaming-zone" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md hover:bg-discord-hover/50 text-discord-muted hover:text-white text-xs">
          <i class="fa-solid fa-gamepad text-sm"></i><span>gaming-zone</span>
        </button>

        <div class="flex items-center px-2 pt-5 pb-1 text-[11px] font-bold tracking-wider text-discord-subtle uppercase">
          <span><i class="fa-solid fa-chevron-down text-[9px] mr-1"></i>Voice Channels</span>
        </div>
        <button class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-discord-muted opacity-70 cursor-not-allowed text-xs">
          <i class="fa-solid fa-volume-high text-sm"></i><span>Lounge Voice</span>
        </button>
      </div>

      <footer class="h-14 bg-discord-darkest/90 px-2.5 flex items-center justify-between border-t border-discord-rail/50 shrink-0">
        <div class="flex items-center gap-2 overflow-hidden flex-1 p-1 rounded-md">
          <div class="relative shrink-0">
            <img id="userAvatar" src="https://api.dicebear.com/9.x/avataaars/svg?seed=SchoolFriendsUser" class="w-8 h-8 rounded-full object-cover bg-discord-chat" alt="User Avatar">
            <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-green rounded-full border-2 border-discord-darkest"></div>
          </div>
          <div class="flex flex-col truncate leading-tight">
            <span id="userName" class="text-xs font-bold text-white truncate">Guest</span>
            <span id="userTag" class="text-[10px] text-discord-subtle truncate">#0001</span>
          </div>
        </div>
        <div class="flex items-center gap-0.5">
          <button id="micToggleBtn" class="p-1.5 text-discord-subtle hover:text-white rounded hover:bg-discord-hover" title="Mute Mic"><i class="fa-solid fa-microphone text-xs"></i></button>
          <button id="deafenToggleBtn" class="p-1.5 text-discord-subtle hover:text-white rounded hover:bg-discord-hover" title="Deafen"><i class="fa-solid fa-headphones text-xs"></i></button>
          <button id="logoutBtn" class="p-1.5 text-discord-subtle hover:text-discord-rose rounded hover:bg-discord-hover" title="Log Out"><i class="fa-solid fa-right-from-bracket text-xs"></i></button>
        </div>
      </footer>
    </aside>

    <!-- CHAT -->
    <main class="flex-1 flex flex-col bg-discord-chat min-w-0 relative h-full">
      <header class="h-12 px-4 flex items-center justify-between border-b border-discord-rail bg-discord-chat shrink-0 z-10 shadow-subtle-bar">
        <div class="flex items-center gap-3 min-w-0">
          <button id="toggleMenuBtn" class="sm:hidden text-discord-muted hover:text-white"><i class="fa-solid fa-bars text-lg"></i></button>
          <div class="flex items-center gap-2 min-w-0">
            <i id="channelIcon" class="fa-solid fa-hashtag text-discord-subtle text-lg"></i>
            <span id="currentChannelTitle" class="font-bold text-white text-sm truncate">general-chat</span>
            <span class="hidden md:inline-block w-px h-4 bg-discord-input mx-1"></span>
            <span id="currentChannelTopic" class="hidden md:inline-block text-xs text-discord-subtle truncate max-w-xs">General conversation for school friends</span>
          </div>
        </div>
        <div class="flex items-center gap-3.5 text-discord-muted text-sm shrink-0">
          <button title="Notifications" class="hover:text-white"><i class="fa-solid fa-bell"></i></button>
          <button title="Pinned Messages" class="hover:text-white"><i class="fa-solid fa-thumbtack"></i></button>
          <button id="toggleMemberListBtn" title="Toggle Member List" class="hover:text-white"><i class="fa-solid fa-users"></i></button>
          <div class="relative hidden sm:block">
            <input id="searchInput" type="text" placeholder="Search" class="bg-discord-rail text-xs text-white placeholder-discord-subtle px-2.5 py-1 rounded w-36 focus:w-48 focus:outline-none transition-all">
            <i class="fa-solid fa-magnifying-glass text-xs text-discord-subtle absolute right-2 top-1.5"></i>
          </div>
        </div>
      </header>

      <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

      <div id="imagePreviewBar" class="hidden px-4 py-2 bg-discord-sidebar border-t border-discord-rail items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="previewImg" class="w-12 h-12 object-cover rounded-lg border border-discord-input" alt="Upload preview">
          <div><div class="text-xs font-semibold text-white">Attached Image</div><div id="previewFileName" class="text-[10px] text-discord-subtle"></div></div>
        </div>
        <button id="removeImageBtn" class="w-6 h-6 rounded-full bg-discord-rail hover:bg-discord-rose text-white"><i class="fa-solid fa-xmark text-xs"></i></button>
      </div>

      <div class="p-3 sm:p-4 bg-discord-chat shrink-0">
        <form id="messageForm" class="relative w-full rounded-xl flex items-center px-3 py-2 gap-2.5 bg-discord-input focus-within:ring-2 focus-within:ring-brand/60">
          <label class="w-7 h-7 rounded-full bg-[#4e5058] hover:bg-[#6d6f78] flex items-center justify-center cursor-pointer shrink-0" title="Upload Media">
            <i class="fa-solid fa-plus text-[#dbdee1] text-xs"></i>
            <input type="file" id="imageInput" accept="image/*" class="hidden">
          </label>
          <input type="text" id="messageInput" placeholder="Message #general-chat" class="flex-1 bg-transparent text-[#dbdee1] placeholder-discord-subtle focus:outline-none text-sm py-1" maxlength="1000" autocomplete="off">
          <button id="emojiBtn" type="button" class="p-1 hover:text-discord-amber text-discord-muted" title="Add Emoji"><i class="fa-regular fa-face-smile"></i></button>
          <button id="sendBtn" type="submit" class="w-8 h-8 rounded-lg bg-brand hover:bg-brand-hover text-white flex items-center justify-center"><i class="fa-solid fa-paper-plane text-xs"></i></button>
        </form>
      </div>
    </main>

    <!-- MEMBERS -->
    <aside id="memberSidebar" class="hidden lg:flex w-60 bg-discord-sidebar flex-col shrink-0 border-l border-discord-rail/80">
      <div class="p-4 overflow-y-auto space-y-4">
        <div>
          <h3 class="text-[11px] font-bold tracking-wider text-discord-subtle uppercase mb-2">Online — <span id="onlineCount">1</span></h3>
          <div id="onlineMemberList"></div>
        </div>
        <div>
          <h3 class="text-[11px] font-bold tracking-wider text-discord-subtle uppercase mb-2">Offline — 2</h3>
          <div class="space-y-1">
            <div class="flex items-center gap-2.5 px-2 py-1.5 rounded opacity-60">
              <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Alice" class="w-8 h-8 rounded-full" alt="Alice">
              <span class="text-xs font-semibold text-discord-muted">Alice</span>
            </div>
            <div class="flex items-center gap-2.5 px-2 py-1.5 rounded opacity-60">
              <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Sudip" class="w-8 h-8 rounded-full" alt="Sudip">
              <span class="text-xs font-semibold text-discord-muted">Sudip</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Simple settings modal -->
  <div id="settingsModal" class="hidden fixed inset-0 z-[100] bg-black/70 items-center justify-center p-4">
    <div class="w-full max-w-md bg-discord-sidebar rounded-xl border border-discord-input shadow-2xl p-5">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-white font-bold text-lg">SchoolFriends Settings</h2>
        <button id="closeSettingsBtn" class="text-discord-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <label class="block text-xs text-discord-subtle mb-2">Display name</label>
      <input id="displayNameInput" class="w-full bg-discord-input text-white rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-brand" maxlength="32">
      <button id="saveSettingsBtn" class="mt-4 w-full bg-brand hover:bg-brand-hover text-white rounded-lg py-2 font-semibold">Save</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
