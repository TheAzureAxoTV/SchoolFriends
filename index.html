<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SchoolFriends — Private Campus Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-navy: #0b111e;
      --bg-panel: rgba(14, 21, 37, 0.72);
      --bg-card: rgba(19, 29, 51, 0.65);
      --bg-glass: rgba(255, 255, 255, 0.05);
      --bg-glass-hover: rgba(255, 255, 255, 0.09);
      --bg-glass-active: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.35);
      --txt-primary: #f8fafc;
      --txt-secondary: #94a3b8;
      --txt-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --accent-bubble: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --aurora-1: rgba(79, 70, 229, 0.22);
      --aurora-2: rgba(217, 70, 239, 0.18);
      --aurora-3: rgba(14, 165, 233, 0.16);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --role-owner: #f59e0b;
      --role-admin: #8b5cf6;
      --role-mod: #06b6d4;
      --role-student: #10b981;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 48px -8px rgba(0, 0, 0, 0.55), 0 0 40px rgba(99, 102, 241, 0.12);
      --blur-glass: blur(20px);
      --transition-fast: 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-norm: 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--txt-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .hidden {
      display: none !important;
    }

    /* Ambient Aurora Glow Canvas */
    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      
      opacity: 0.85;
      animation: floatAurora 18s ease-in-out infinite alternate;
    }
    .aurora-1 {
      width: 480px;
      height: 480px;
      background: var(--aurora-1);
      top: -10%;
      left: 10%;
    }
    .aurora-2 {
      width: 520px;
      height: 520px;
      background: var(--aurora-2);
      bottom: -10%;
      right: 5%;
      animation-duration: 22s;
    }
    .aurora-3 {
      width: 380px;
      height: 380px;
      background: var(--aurora-3);
      top: 40%;
      left: 45%;
      animation-duration: 15s;
    }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora-blob { animation: none; }
      * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
    }

    /* Common Glass Utilities */
    .glass {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
    }
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

    /* =========================================
       1. AUTH / SIGN-IN SCREEN
       ========================================= */
    #auth {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 30%, #111a2f 0%, #060912 100%);
    }

    .auth-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px 32px;
      border-radius: var(--radius-lg);
      background: rgba(13, 20, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(99, 102, 241, 0.2);
      text-align: center;
      z-index: 1;
    }

    .auth-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .auth-title {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .auth-sub {
      font-size: 13.5px;
      color: var(--txt-secondary);
      line-height: 1.55;
      margin-bottom: 28px;
    }

    #authMsg {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 18px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    #lastChip {
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: var(--txt-secondary);
    }

    #gBtn {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-pill);
      background: #ffffff;
      color: #1f2937;
      border: none;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.2);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
    }
    #gBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 20px rgba(255, 255, 255, 0.4);
      background: #f8fafc;
    }
    #gBtn:active {
      transform: translateY(0);
    }
    #gBtn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .auth-toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 22px 0 24px;
      font-size: 13px;
      color: var(--txt-secondary);
      user-select: none;
      cursor: pointer;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.16);
      transition: .24s;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .24s;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    input:checked + .slider {
      background: var(--accent-bubble);
      border-color: rgba(99, 102, 241, 0.6);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .auth-foot {
      font-size: 11.5px;
      color: var(--txt-muted);
      line-height: 1.5;
    }

    #ver {
      display: block;
      margin-top: 14px;
      font-size: 11px;
      color: var(--txt-muted);
      font-family: ui-monospace, monospace;
    }

    /* =========================================
       2. MAIN APP SHELL
       ========================================= */
    #app {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Scrim on mobile */
    #scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-norm);
    }
    #scrim.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Server Rail */
    #rail {
      width: 68px;
      height: 100%;
      background: rgba(8, 12, 21, 0.85);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 12px;
      z-index: 50;
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
    }

    .srv {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: var(--radius-lg);
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
      color: var(--txt-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }
    .srv:hover {
      background: var(--bg-glass-hover);
      color: var(--txt-primary);
      border-radius: 14px;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .srv.on {
      background: var(--accent-gradient);
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.45);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .srv.on::before {
      content: "";
      position: absolute;
      left: -11px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 24px;
      background: #fff;
      border-radius: 0 4px 4px 0;
    }

    /* Channel Sidebar */
    #side {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 68px;
      width: 260px;
      background: var(--bg-navy);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 45;
      transform: translateX(-150%);
      transition: transform var(--transition-norm);
    }
    #side.open {
      transform: translateX(0);
    }

    @media (min-width: 860px) {
      #side {
        position: static;
        transform: none !important;
        flex-shrink: 0;
      }
      #scrim { display: none !important; }
    }

    .side-head {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .side-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .side-brand i {
      color: var(--accent-primary);
      font-size: 17px;
    }

    #menuBtn {
      background: transparent;
      border: none;
      color: var(--txt-secondary);
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #menuBtn:hover {
      color: #fff;
      background: var(--bg-glass);
    }

    /* Channels Container */
    #chs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-sec-label {
      padding: 10px 8px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--txt-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ch {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      color: var(--txt-secondary);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
      text-decoration: none;
    }
    .ch:hover {
      background: var(--bg-glass-hover);
      color: var(--txt-primary);
    }
    .ch.on {
      background: rgba(99, 102, 241, 0.16);
      color: #fff;
      font-weight: 600;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .ch i {
      font-size: 15px;
      color: var(--txt-muted);
      width: 18px;
      text-align: center;
    }
    .ch.on i {
      color: var(--accent-primary);
    }

    /* Extensible Sidebar Sections (Future Modules) */
    .side-ext {
      padding: 8px 10px;
      border-top: 1px solid var(--border-subtle);
    }
    .ext-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      color: var(--txt-muted);
      font-size: 12.5px;
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .ext-item:hover { color: var(--txt-secondary); }

    /* Current User Footer */
    .side-foot {
      padding: 10px 12px;
      background: rgba(9, 14, 25, 0.95);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #avBtn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
      flex: 1;
      min-width: 0;
      padding: 4px;
      border-radius: var(--radius-sm);
    }
    #avBtn:hover {
      background: var(--bg-glass);
    }

    #meImg {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-primary);
      flex-shrink: 0;
      background: #1e293b;
    }
    .me-info {
      min-width: 0;
      flex: 1;
    }
    #meName {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #meBio {
      font-size: 11px;
      color: var(--txt-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .foot-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--txt-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-icon:hover {
      background: var(--bg-glass);
      color: #fff;
    }

    /* =========================================
       3. CHAT VIEWPORT & HEADER
       ========================================= */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      position: relative;
      background: var(--bg-dark);
    }

    .chat-header {
      height: 60px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(11, 17, 30, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
    }

    .ch-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    #chIcon {
      font-size: 20px;
      color: var(--accent-primary);
    }
    .ch-titles {
      min-width: 0;
    }
    #chTitle {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #chDesc {
      font-size: 12px;
      color: var(--txt-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #termBtn {
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }
    #termBtn:hover {
      background: rgba(245, 158, 11, 0.22);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.25);
    }

    /* =========================================
       4. MESSAGES FEED & BUBBLE STYLING
       ========================================= */
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Message Item Wrapper */
    .m {
      position: relative;
      display: flex;
      flex-direction: column;
      max-width: 82%;
      align-self: flex-start;
      margin-bottom: 2px;
      animation: msgIn var(--transition-fast) ease-out;
    }
    .m.mine {
      align-self: flex-end;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header for group first message */
    .m .h {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      padding: 0 4px;
      font-size: 12px;
    }
    .m.mine .h {
      flex-direction: row-reverse;
    }
    .m .sp {
      font-weight: 600;
      color: var(--txt-primary);
    }

    /* Roles badges */
    .role {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }
    .role.owner {
      background: rgba(245, 158, 11, 0.18);
      color: var(--role-owner);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .role.admin {
      background: rgba(139, 92, 246, 0.18);
      color: var(--role-admin);
      border: 1px solid rgba(139, 92, 246, 0.35);
    }
    .role.mod {
      background: rgba(6, 182, 212, 0.18);
      color: var(--role-mod);
      border: 1px solid rgba(6, 182, 212, 0.35);
    }
    .role.student {
      background: rgba(16, 185, 129, 0.18);
      color: var(--role-student);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    /* Chat bubble surface */
    .m .tb {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    /* Others' bubbles: Dark Glass on Left */
    .m:not(.mine) .tb {
      background: rgba(23, 32, 54, 0.85);
      border: 1px solid var(--border-subtle);
      border-top-left-radius: 4px;
      color: var(--txt-primary);
    }

    /* Mine bubbles: Gradient on Right */
    .m.mine .tb {
      background: var(--accent-bubble);
      color: #ffffff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
    }

    /* Rep
