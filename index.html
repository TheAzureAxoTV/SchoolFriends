<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolFriends</title>

  <!-- LOGO & FAVICON CONFIGURATION -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png?v=2">
  <meta name="apple-mobile-web-app-title" content="SchoolFriends">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F0F17">

  <!-- GOOGLE FONTS & TAILWIND CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0c0d14;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(22, 22, 34, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .purple-card {
      background: linear-gradient(135deg, rgba(30, 27, 58, 0.9) 0%, rgba(20, 18, 38, 0.95) 100%);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
    .avatar-bg {
      background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
    }
  </style>
</head>
<body class="min-h-screen pb-12 px-4 pt-4 max-w-md mx-auto">

  <!-- TOP BAR / SEARCH -->
  <header class="flex items-center gap-2 mb-5">
    <div class="relative flex-1">
      <input 
        type="text" 
        placeholder="Search SchoolFriends" 
        class="w-full bg-[#161622] text-sm text-gray-200 placeholder-gray-500 rounded-2xl py-3 pl-4 pr-10 focus:outline-none focus:ring-1 focus:ring-purple-500 border border-white/5"
      />
    </div>
    <button class="bg-[#161622] p-3 rounded-2xl border border-white/5 text-gray-400 hover:text-white">
      ⚡
    </button>
    <button id="authBtn" onclick="handleLogin()" class="bg-[#161622] p-3 rounded-2xl border border-white/5 text-gray-400 hover:text-white">
      ⚙️
    </button>
  </header>

  <!-- MAIN HERO CARD -->
  <section class="purple-card rounded-3xl p-6 mb-5 shadow-xl">
    <span class="text-[11px] font-bold tracking-widest text-purple-400 uppercase">SCHOOL SPACE • TODAY</span>
    <h1 id="userGreeting" class="text-2xl font-extrabold text-white mt-1 mb-2">Good morning, Azure.</h1>
    <p class="text-xs text-gray-400 leading-relaxed mb-6">
      Stay connected with your friends, groups and school events — all in one place.
    </p>

    <!-- STATS ROW -->
    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10">
      <div>
        <div class="text-xl font-extrabold text-white">42</div>
        <div class="text-[11px] text-gray-400">Friends</div>
      </div>
      <div>
        <div class="text-xl font-extrabold text-white">7</div>
        <div class="text-[11px] text-gray-400">Badges</div>
      </div>
      <div>
        <div class="text-xl font-extrabold text-white">710</div>
        <div class="text-[11px] text-gray-400">Points</div>
      </div>
    </div>
  </section>

  <!-- YOUR FRIENDS SECTION -->
  <section class="glass-card rounded-3xl p-5 mb-5">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-bold text-white">Your friends</h2>
      <button class="text-xs text-purple-400 font-semibold bg-white/5 px-3 py-1 rounded-full">View all</button>
    </div>

    <!-- AVATAR HORIZONTAL SCROLL -->
    <div class="flex gap-4 overflow-x-auto pb-2 scrollbar-none">
      <div class="flex flex-col items-center gap-2 min-w-[56px]">
        <div class="w-14 h-14 avatar-bg rounded-2xl flex items-center justify-center text-white font-bold text-lg shadow-md">
          A
        </div>
        <span class="text-xs text-gray-300 font-medium">Alex</span>
      </div>

      <div class="flex flex-col items-center gap-2 min-w-[56px]">
        <div class="w-14 h-14 avatar-bg rounded-2xl flex items-center justify-center text-white font-bold text-lg shadow-md">
          S
        </div>
        <span class="text-xs text-gray-300 font-medium">Sam</span>
      </div>

      <div class="flex flex-col items-center gap-2 min-w-[56px]">
        <div class="w-14 h-14 avatar-bg rounded-2xl flex items-center justify-center text-white font-bold text-lg shadow-md">
          J
        </div>
        <span class="text-xs text-gray-300 font-medium">Jay</span>
      </div>

      <div class="flex flex-col items-center gap-2 min-w-[56px]">
        <div class="w-14 h-14 avatar-bg rounded-2xl flex items-center justify-center text-white font-bold text-lg shadow-md">
          M
        </div>
        <span class="text-xs text-gray-300 font-medium">Mia</span>
      </div>
    </div>
  </section>

  <!-- CLASS BOARD SECTION -->
  <section class="glass-card rounded-3xl p-5 mb-5">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-bold text-white">Class board</h2>
      <span class="text-xs text-purple-400 font-semibold bg-purple-500/10 px-3 py-1 rounded-full">This week</span>
    </div>

    <div class="space-y-2">
      <div class="bg-white/5 rounded-2xl p-3 flex items-center gap-3">
        <span class="text-xs font-bold text-gray-400 w-5">01</span>
        <span class="text-sm font-semibold text-white flex-1">Sam</span>
      </div>
      <div class="bg-white/5 rounded-2xl p-3 flex items-center gap-3">
        <span class="text-xs font-bold text-gray-400 w-5">02</span>
        <span class="text-sm font-semibold text-white flex-1">Alex</span>
      </div>
      <div class="bg-purple-500/10 border border-purple-500/20 rounded-2xl p-3 flex items-center gap-3">
        <span class="text-xs font-bold text-purple-400 w-5">03</span>
        <span class="text-sm font-semibold text-purple-200 flex-1">You</span>
      </div>
    </div>
  </section>

  <!-- MEDIA UPLOAD WIDGET (CLOUDINARY READY) -->
  <section class="glass-card rounded-3xl p-5">
    <h2 class="text-base font-bold text-white mb-2">Share a photo</h2>
    <div class="flex gap-2">
      <input type="file" id="mediaInput" accept="image/*" class="text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 w-full" />
      <button onclick="uploadMedia()" class="bg-white/10 text-xs font-bold px-4 py-2 rounded-xl text-white hover:bg-white/20 shrink-0">Upload</button>
    </div>
  </section>

  <!-- FIREBASE & CLOUDINARY SCRIPT INTEGRATION -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    // REPLACE THESE WITH YOUR FIREBASE KEYS WHEN READY
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "schoolfriends.pntr.dev",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUD_NAME"; 
    const CLOUDINARY_UPLOAD_PRESET = "YOUR_UNSIGNED_PRESET"; 

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    window.handleLogin = async function() {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        console.log("User logged in:", result.user.displayName);
      } catch (err) {
        console.log("Auth setup pending or login cancelled.");
      }
    };

    onAuthStateChanged(auth, (user) => {
      const greeting = document.getElementById('userGreeting');
      if (user && greeting) {
        const firstName = user.displayName.split(' ')[0];
        greeting.textContent = `Good day, ${firstName}.`;
      }
    });

    window.uploadMedia = async function() {
      const input = document.getElementById('mediaInput');
      const file = input.files[0];
      if (!file) return alert('Select an image first.');
      
      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        alert('Image uploaded: ' + data.secure_url);
      } catch (e) {
        alert('Set up Cloudinary preset keys to enable uploads!');
      }
    };
  </script>
</body>
  </html>
