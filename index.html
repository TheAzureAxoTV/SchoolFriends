<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SchoolFriends</title>

  <!-- LOGO & FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png?v=2">
  <meta name="theme-color" content="#2b2d31">

  <!-- TAILWIND CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #313338; color: #dbdee1; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
  </style>
</head>
<body class="h-screen w-screen flex overflow-hidden font-sans select-none">

  <!-- SIDEBAR (CHANNELS & DMS) -->
  <aside class="w-64 bg-[#2b2d31] flex flex-col shrink-0 border-r border-[#1f2023]">
    <!-- APP HEADER -->
    <div class="h-12 px-4 border-b border-[#1f2023] flex items-center justify-between shadow-sm">
      <h1 class="font-bold text-white text-base tracking-wide flex items-center gap-2">
        <span class="text-purple-400">#</span> SchoolFriends
      </h1>
    </div>

    <!-- NAVIGATION LIST -->
    <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-4">
      
      <!-- PUBLIC CHAT SECTION -->
      <div>
        <div class="text-[11px] font-bold text-[#949ba4] px-2 mb-1 uppercase tracking-wider">Public Channel</div>
        <button id="btnPublicChat" onclick="switchTab('public')" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md bg-[#404249] text-white font-medium text-sm">
          <span class="text-xl text-gray-400">#</span> general-public
        </button>
      </div>

      <!-- DIRECT MESSAGES SECTION -->
      <div>
        <div class="flex items-center justify-between px-2 mb-1">
          <span class="text-[11px] font-bold text-[#949ba4] uppercase tracking-wider">Direct Messages</span>
          <button onclick="addFriendPrompt()" class="text-xs text-gray-400 hover:text-white" title="Add 1-on-1 Friend">+</button>
        </div>
        
        <!-- DMs LIST (DYNAMICALLY POPULATED ON LOG IN) -->
        <div id="dmList" class="space-y-0.5">
          <div class="px-2 py-2 text-xs text-gray-500 italic">No 1-on-1 chats yet</div>
        </div>
      </div>

    </div>

    <!-- USER BAR (BOTTOM) -->
    <div class="h-14 bg-[#232428] px-2 flex items-center justify-between">
      <div class="flex items-center gap-2 overflow-hidden">
        <img id="userAvatar" src="favicon.png?v=2" class="w-8 h-8 rounded-full bg-purple-600 object-cover shrink-0" alt="Avatar">
        <div class="truncate">
          <div id="userName" class="text-xs font-semibold text-white truncate">Guest</div>
          <div id="userStatus" class="text-[10px] text-gray-400 truncate">Offline</div>
        </div>
      </div>
      <button id="authBtn" onclick="handleAuthAction()" class="bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-medium px-2.5 py-1.5 rounded transition">
        Sign In
      </button>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main class="flex-1 flex flex-col bg-[#313338]">
    
    <!-- CHAT HEADER -->
    <header class="h-12 border-b border-[#1f2023] px-4 flex items-center gap-2 shadow-sm bg-[#313338]">
      <span id="activeChannelPrefix" class="text-xl text-gray-400">#</span>
      <h2 id="activeChannelTitle" class="font-bold text-white text-sm">general-public</h2>
    </header>

    <!-- MESSAGES FEED -->
    <div id="messagesFeed" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
      <div class="text-center py-8 text-gray-500 text-xs border-b border-white/5">
        👋 Welcome to the public chat! Sign in to post messages.
      </div>
    </div>

    <!-- CHAT INPUT FORM -->
    <div class="p-4 bg-[#313338]">
      <form onsubmit="sendMessage(event)" class="bg-[#383a40] rounded-lg px-3 py-2 flex items-center gap-2">
        <label for="mediaInput" class="cursor-pointer text-gray-400 hover:text-white p-1">
          📎
          <input type="file" id="mediaInput" accept="image/*" class="hidden" onchange="uploadImage(event)">
        </label>
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Message #general-public" 
          class="bg-transparent flex-1 text-sm text-white placeholder-[#87898c] focus:outline-none"
          autocomplete="off"
        >
        <button type="submit" class="text-xs bg-[#5865f2] hover:bg-[#4752c4] text-white px-3 py-1.5 rounded font-medium">
          Send
        </button>
      </form>
    </div>

  </main>

  <!-- FIREBASE & CLOUDINARY LOGIC -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    // FIREBASE KEYS (REPLACE WHEN READY)
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "schoolfriends.pntr.dev",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUD_NAME"; 
    const CLOUDINARY_UPLOAD_PRESET = "YOUR_UNSIGNED_PRESET"; 

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let activeTab = 'public';

    // AUTH HANDLING
    window.handleAuthAction = async function() {
      if (currentUser) {
        await signOut(auth);
      } else {
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          alert("Firebase credentials not configured yet. Connect keys in index.html!");
        }
      }
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const userNameEl = document.getElementById('userName');
      const userStatusEl = document.getElementById('userStatus');
      const userAvatarEl = document.getElementById('userAvatar');
      const authBtn = document.getElementById('authBtn');

      if (user) {
        userNameEl.textContent = user.displayName;
        userStatusEl.textContent = "Online";
        userAvatarEl.src = user.photoURL || 'favicon.png?v=2';
        authBtn.textContent = "Sign Out";
        authBtn.className = "bg-red-600 hover:bg-red-700 text-white text-xs font-medium px-2.5 py-1.5 rounded transition";
      } else {
        userNameEl.textContent = "Guest";
        userStatusEl.textContent = "Offline";
        userAvatarEl.src = 'favicon.png?v=2';
        authBtn.textContent = "Sign In";
        authBtn.className = "bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-medium px-2.5 py-1.5 rounded transition";
      }
    });

    // NAVIGATION TABS
    window.switchTab = function(tabName, friendName = '') {
      activeTab = tabName;
      const titleEl = document.getElementById('activeChannelTitle');
      const prefixEl = document.getElementById('activeChannelPrefix');
      const inputEl = document.getElementById('messageInput');

      if (tabName === 'public') {
        titleEl.textContent = 'general-public';
        prefixEl.textContent = '#';
        inputEl.placeholder = 'Message #general-public';
      } else {
        titleEl.textContent = friendName;
        prefixEl.textContent = '@';
        inputEl.placeholder = `Message @${friendName}`;
      }
    };

    window.addFriendPrompt = function() {
      const name = prompt("Enter friend's user name to start a 1-on-1 chat:");
      if (!name) return;
      
      const dmList = document.getElementById('dmList');
      if (dmList.innerText.includes('No 1-on-1 chats yet')) {
        dmList.innerHTML = '';
      }

      const button = document.createElement('button');
      button.className = "w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-[#35373c] text-gray-300 font-medium text-sm text-left truncate";
      button.onclick = () => switchTab('dm', name);
      button.innerHTML = `<span class="text-gray-400">@</span> <span class="truncate">${name}</span>`;
      dmList.appendChild(button);

      switchTab('dm', name);
    };

    // CHAT MESSAGES
    window.sendMessage = function(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const feed = document.getElementById('messagesFeed');
      const msg = document.createElement('div');
      msg.className = "flex items-start gap-3";

      const avatar = currentUser ? currentUser.photoURL : 'favicon.png?v=2';
      const name = currentUser ? currentUser.displayName : 'Guest';
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msg.innerHTML = `
        <img src="${avatar}" class="w-10 h-10 rounded-full bg-purple-600 object-cover mt-0.5 shrink-0">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-white text-sm">${name}</span>
            <span class="text-[10px] text-gray-400">${time}</span>
          </div>
          <p class="text-sm text-gray-200 mt-0.5 leading-relaxed">${text}</p>
        </div>
      `;

      feed.appendChild(msg);
      input.value = '';
      feed.scrollTop = feed.scrollHeight;
    };

    // CLOUDINARY UPLOAD
    window.uploadImage = async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        
        if (data.secure_url) {
          document.getElementById('messageInput').value += ` ${data.secure_url}`;
        }
      } catch (err) {
        alert("Cloudinary upload preset keys required for image uploads.");
      }
    };
  </script>
</body>
      </html>
