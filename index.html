<!DOCTYPE html>
<html lang="en" class="h-full bg-[#1e1f22] text-[#dbdee1] antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SchoolFriends | Chat Client</title>
  <link rel="shortcut icon" href="logo10_3_13369.png" type="image/png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#5865f2',
              hover: '#4752c4',
              active: '#3c45a5',
              light: '#7983f5'
            },
            discord: {
              sidebar: '#2b2d31',
              chat: '#313338',
              rail: '#1e1f22',
              darkest: '#111214',
              input: '#383a40',
              hover: '#35373c',
              active: '#404249',
              muted: '#949ba4',
              subtle: '#80848e',
              green: '#23a55a',
              amber: '#f0b232',
              rose: '#f23f43'
            }
          },
          boxShadow: {
            'glow-brand': '0 0 15px rgba(88, 101, 242, 0.4)',
            'subtle-bar': '0 1px 2px rgba(0, 0, 0, 0.2)'
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #111214;
    }

    /* Glassmorphism utility */
    .glass-header {
      background: rgba(49, 51, 56, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Dynamic Message Animations */
    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-msg {
      animation: fadeInMsg 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-full w-full flex overflow-hidden font-sans select-none bg-discord-rail text-discord-muted">

  <!-- MOBILE OVERLAY BACKDROP -->
  <div id="mobileBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-xs z-30 hidden transition-opacity duration-300"></div>

  <!-- MAIN APP CONTAINER -->
  <div class="flex h-full w-full overflow-hidden">

    <!-- ========================================== -->
    <!-- 1. LEFT SERVER RAIL (ALWAYS VISIBLE)        -->
    <!-- ========================================== -->
    <aside class="w-[72px] bg-discord-rail flex flex-col items-center py-3 gap-2 shrink-0 border-r border-discord-sidebar/40 z-50">
      
      <!-- Home / Server Icon -->
      <div class="relative group cursor-pointer" id="homeServerBtn" title="SchoolFriends Server">
        <div id="activeServerPill" class="absolute -left-3 top-2.5 w-1.5 h-7 bg-brand rounded-r-full transition-all duration-200"></div>
        <div class="w-12 h-12 rounded-[24px] group-hover:rounded-[16px] bg-discord-sidebar overflow-hidden transition-all duration-200 border border-brand/30 shadow-lg group-hover:shadow-glow-brand flex items-center justify-center">
          <img src="logo10_3_13369.png" class="w-full h-full object-cover" alt="Server Logo" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=SchoolFriends';" />
        </div>
      </div>

      <div class="w-8 h-[2px] bg-discord-input/60 rounded-full my-1"></div>

      <!-- Add Server Button -->
      <button class="w-12 h-12 rounded-[24px] bg-discord-sidebar hover:bg-discord-green hover:rounded-[16px] flex items-center justify-center text-discord-green hover:text-white transition-all duration-200 cursor-pointer group shadow-sm" title="Add Server">
        <i class="fa-solid fa-plus text-lg group-hover:scale-110 transition-transform"></i>
      </button>

      <!-- Explore Public Servers -->
      <button class="w-12 h-12 rounded-[24px] bg-discord-sidebar hover:bg-brand hover:rounded-[16px] flex items-center justify-center text-discord-subtle hover:text-white transition-all duration-200 cursor-pointer group shadow-sm" title="Explore Community">
        <i class="fa-solid fa-compass text-lg group-hover:scale-110 transition-transform"></i>
      </button>

      <div class="mt-auto flex flex-col items-center gap-2">
        <!-- Settings Button -->
        <button id="openSettingsBtn" class="w-12 h-12 rounded-[24px] bg-discord-sidebar hover:bg-discord-hover hover:rounded-[16px] flex items-center justify-center text-discord-subtle hover:text-white transition-all duration-200 cursor-pointer shadow-sm" title="User Settings">
          <i class="fa-solid fa-gear text-base"></i>
        </button>
      </div>

    </aside>

    <!-- ========================================== -->
    <!-- 2. CHANNEL SIDEBAR (RESPONSIVE DRAWER)     -->
    <!-- ========================================== -->
    <aside id="channelSidebar" class="fixed sm:relative inset-y-0 left-[72px] sm:left-0 w-64 bg-discord-sidebar flex flex-col shrink-0 border-r border-discord-rail/80 z-40 transform -translate-x-full sm:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl sm:shadow-none">
      
      <!-- Server Header Dropdown -->
      <header class="h-12 px-4 flex items-center justify-between border-b border-discord-rail/90 shadow-subtle-bar shrink-0 cursor-pointer hover:bg-discord-hover/50 transition">
        <h1 class="font-bold text-white text-sm tracking-wide flex items-center gap-2 truncate">
          <span class="truncate">SchoolFriends</span>
          <i class="fa-solid fa-circle-check text-xs text-brand" title="Verified Community"></i>
        </h1>
        <i class="fa-solid fa-chevron-down text-xs text-discord-muted"></i>
      </header>

      <!-- Channels List Scroll Area -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="channelContainer">
        
        <!-- Text Channels Section -->
        <div class="flex items-center justify-between px-2 pt-3 pb-1 text-[11px] font-bold tracking-wider text-discord-subtle uppercase">
          <span class="flex items-center gap-1">
            <i class="fa-solid fa-chevron-down text-[9px]"></i> Text Channels
          </span>
          <i class="fa-solid fa-plus hover:text-white cursor-pointer transition" title="Create Channel"></i>
        </div>

        <button data-channel="general-chat" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md bg-discord-hover text-white font-medium text-xs transition active:scale-[0.98] group">
          <i class="fa-solid fa-hashtag text-discord-subtle group-hover:text-white text-sm transition"></i>
          <span class="truncate">general-chat</span>
          <span class="ml-auto w-2 h-2 rounded-full bg-brand hidden" id="badge-general-chat"></span>
        </button>

        <button data-channel="announcements" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md hover:bg-discord-hover/50 text-discord-muted hover:text-[#dbdee1] font-medium text-xs transition active:scale-[0.98] group">
          <i class="fa-solid fa-bullhorn text-discord-subtle group-hover:text-white text-sm transition"></i>
          <span class="truncate">announcements</span>
        </button>

        <button data-channel="polls" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md hover:bg-discord-hover/50 text-discord-muted hover:text-[#dbdee1] font-medium text-xs transition active:scale-[0.98] group">
          <i class="fa-solid fa-square-poll-vertical text-discord-subtle group-hover:text-white text-sm transition"></i>
          <span class="truncate">polls</span>
        </button>

        <button data-channel="gaming-zone" class="channel-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md hover:bg-discord-hover/50 text-discord-muted hover:text-[#dbdee1] font-medium text-xs transition active:scale-[0.98] group">
          <i class="fa-solid fa-gamepad text-discord-subtle group-hover:text-white text-sm transition"></i>
          <span class="truncate">gaming-zone</span>
        </button>

        <!-- Voice Channels Section -->
        <div class="flex items-center justify-between px-2 pt-5 pb-1 text-[11px] font-bold tracking-wider text-discord-subtle uppercase">
          <span class="flex items-center gap-1">
            <i class="fa-solid fa-chevron-down text-[9px]"></i> Voice Channels
          </span>
        </div>

        <button class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md hover:bg-discord-hover/50 text-discord-muted hover:text-[#dbdee1] font-medium text-xs transition cursor-not-allowed opacity-70">
          <i class="fa-solid fa-volume-high text-discord-subtle text-sm"></i>
          <span class="truncate">Lounge Voice</span>
        </button>

      </div>

      <!-- User Profile Footer Bar -->
      <footer class="h-14 bg-discord-darkest/90 px-2.5 flex items-center justify-between border-t border-discord-rail/50 shrink-0">
        <div class="flex items-center gap-2 overflow-hidden flex-1 cursor-pointer hover:bg-discord-hover/30 p-1 rounded-md transition">
          <div class="relative shrink-0">
            <img id="userAvatar" src="logo10_3_1188.png" class="w-8 h-8 rounded-full object-cover bg-discord-chat border border-discord-input" alt="User Avatar" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=User';" />
            <div id="userStatusDot" class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-green rounded-full border-2 border-discord-darkest"></div>
          </div>
          <div class="flex flex-col truncate leading-tight">
            <span id="userName" class="text-xs font-bold text-white truncate">Connecting...</span>
            <span id="userTag" class="text-[10px] text-discord-subtle truncate">#0001</span>
          </div>
        </div>

        <div class="flex items-center gap-0.5">
          <button id="micToggleBtn" class="p-1.5 text-discord-subtle hover:text-white rounded hover:bg-discord-hover transition" title="Mute Mic">
            <i class="fa-solid fa-microphone text-xs"></i>
          </button>
          <button id="deafenToggleBtn" class="p-1.5 text-discord-subtle hover:text-white rounded hover:bg-discord-hover transition" title="Deafen">
            <i class="fa-solid fa-headphones text-xs"></i>
          </button>
          <button id="logoutBtn" class="p-1.5 text-discord-subtle hover:text-discord-rose rounded hover:bg-discord-hover transition" title="Log Out">
            <i class="fa-solid fa-right-from-bracket text-xs"></i>
          </button>
        </div>
      </footer>

    </aside>

    <!-- ========================================== -->
    <!-- 3. MAIN CHAT AREA                          -->
    <!-- ========================================== -->
    <main class="flex-1 flex flex-col bg-discord-chat min-w-0 relative h-full">
      
      <!-- Top Chat Header -->
      <header class="h-12 px-4 flex items-center justify-between border-b border-discord-rail bg-discord-chat shrink-0 z-10 shadow-subtle-bar">
        <div class="flex items-center gap-3 min-w-0">
          <!-- Mobile Sidebar Toggle Hamburger -->
          <button id="toggleMenuBtn" class="sm:hidden text-discord-muted hover:text-white transition focus:outline-none">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>

          <div class="flex items-center gap-2 min-w-0">
            <i class="fa-solid fa-hashtag text-discord-subtle text-lg"></i>
            <span id="currentChannelTitle" class="font-bold text-white text-sm truncate">general-chat</span>
            <span class="hidden md:inline-block w-[1px] h-4 bg-discord-input mx-1"></span>
            <span id="currentChannelTopic" class="hidden md:inline-block text-xs text-discord-subtle truncate max-w-xs">General conversation for school friends</span>
          </div>
        </div>

        <div class="flex items-center gap-3.5 text-discord-muted text-sm shrink-0">
          <button class="hover:text-white transition cursor-pointer" title="Notification Settings">
            <i class="fa-solid fa-bell"></i>
          </button>
          <button class="hover:text-white transition cursor-pointer" title="Pinned Messages">
            <i class="fa-solid fa-thumbtack"></i>
          </button>
          <button id="toggleMemberListBtn" class="hover:text-white transition cursor-pointer" title="Toggle Member List">
            <i class="fa-solid fa-users"></i>
          </button>
          <div class="relative hidden sm:block">
            <input type="text" placeholder="Search" class="bg-discord-rail text-xs text-white placeholder-discord-subtle px-2.5 py-1 rounded w-36 focus:w-48 focus:outline-none transition-all duration-200" />
            <i class="fa-solid fa-magnifying-glass text-xs text-discord-subtle absolute right-2 top-1.5"></i>
          </div>
        </div>
      </header>

      <!-- Chat Messages Scroll Box -->
      <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Messages loaded dynamically via app.js -->
      </div>

      <!-- Image Upload Preview Bar -->
      <div id="imagePreviewBar" class="hidden px-4 py-2 bg-discord-sidebar border-t border-discord-rail flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="previewImg" class="w-12 h-12 object-cover rounded-lg border border-discord-input" src="" alt="Upload preview" />
          <div class="flex flex-col">
            <span class="text-xs font-semibold text-white">Attached Image</span>
            <span class="text-[10px] text-discord-subtle" id="previewFileName">image.png</span>
          </div>
        </div>
        <button id="removeImageBtn" class="w-6 h-6 rounded-full bg-discord-rail hover:bg-discord-rose text-white flex items-center justify-center transition text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Bottom Chat Input Bar -->
      <div class="p-3 sm:p-4 bg-discord-chat shrink-0">
        <form id="messageForm" class="relative w-full rounded-xl flex items-center px-3 py-2 gap-2.5 bg-discord-input focus-within:ring-2 focus-within:ring-brand/60 transition-all shadow-inner">
          
          <!-- Attachment Input Button -->
          <label class="w-7 h-7 rounded-full bg-[#4e5058] hover:bg-[#6d6f78] flex items-center justify-center cursor-pointer transition shrink-0 active:scale-95 shadow-sm" title="Upload Media">
            <i class="fa-solid fa-plus text-[#dbdee1] text-xs"></i>
            <input type="file" id="imageInput" accept="image/*" class="hidden" />
          </label>

          <!-- Input Text Area -->
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Message #general-chat" 
            class="flex-1 bg-transparent text-[#dbdee1] placeholder-discord-subtle focus:outline-none text-sm font-normal py-1"
            maxlength="1000"
            autocomplete="off"
          />

          <!-- Action Buttons -->
          <div class="flex items-center gap-2 shrink-0 text-discord-muted">
            <button id="emojiBtn" type="button" class="p-1 hover:text-discord-amber transition" title="Add Emoji">
              <i class="fa-regular fa-face-smile text-base"></i>
            </button>
            <button id="sendBtn" type="submit" class="w-8 h-8 rounded-lg bg-brand hover:bg-brand-hover text-white flex items-center justify-center transition active:scale-95 shadow-sm disabled:opacity-50">
              <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </div>

        </form>
      </div>

    </main>

    <!-- ========================================== -->
    <!-- 4. RIGHT MEMBER LIST SIDEBAR (DESKTOP)     -->
    <!-- ========================================== -->
    <aside id="memberSidebar" class="hidden lg:flex w-60 bg-discord-sidebar flex-col shrink-0 border-l border-discord-rail/80">
      <div class="p-4 overflow-y-auto space-y-4">
        
        <!-- Online Group -->
        <div>
          <h3 class="text-[11px] font-bold tracking-wider text-discord-subtle uppercase mb-2">Online — <span id="onlineCount">1</span></h3>
          <div id="onlineMemberList" class="space-y-1">
            <!-- Current User Item -->
            <div class="flex items-center gap-2.5 px-2 py-1.5 rounded hover:bg-discord-hover/40 transition cursor-pointer group">
              <div class="relative shrink-0">
                <img id="memberUserAvatar" src="logo10_3_1188.png" class="w-8 h-8 rounded-full object-cover bg-discord-chat" alt="User" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=Member';" />
                <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-green rounded-full border-2 border-discord-sidebar"></div>
              </div>
              <div class="flex flex-col truncate">
                <span id="memberUserName" class="text-xs font-semibold text-white truncate">You</span>
                <span class="text-[10px] text-discord-subtle truncate">Playing Minecraft</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Offline Group Sample -->
        <div>
          <h3 class="text-[11px] font-bold tracking-wider text-discord-subtle uppercase mb-2">Offline — 2</h3>
          <div class="space-y-1">
            <div class="flex items-center gap-2.5 px-2 py-1.5 rounded hover:bg-discord-hover/40 transition cursor-pointer opacity-60">
              <div class="relative shrink-0">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alice" class="w-8 h-8 rounded-full bg-discord-chat" alt="Alice" />
                <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-subtle rounded-full border-2 border-discord-sidebar"></div>
              </div>
              <span class="text-xs font-semibold text-discord-muted truncate">Alice</span>
            </div>

            <div class="flex items-center gap-2.5 px-2 py-1.5 rounded hover:bg-discord-hover/40 transition cursor-pointer opacity-60">
              <div class="relative shrink-0">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sudip" class="w-8 h-8 rounded-full bg-discord-chat" alt="Sudip" />
                <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-discord-subtle rounded-full border-2 border-discord-sidebar"></div>
              </div>
              <span class="text-xs font-semibold text-discord-muted truncate">Sudip</span>
            </div>
          </div>
        </div>

      </div>
    </aside>

  </div>

  <script type="module" src="app.js"></script>
</body>
        </html>
