<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SchoolFriends | Campus Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0c10; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .chat-scroll::-webkit-scrollbar { width: 4px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #1f242d; border-radius: 9999px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .bg-sf-dark { background-color: #0b0c10; }
    .bg-sf-sidebar { background-color: #13151a; }
    .bg-sf-channel { background-color: #1a1d24; }
    .bg-sf-input { background-color: #222630; }
  </style>
</head>
<body class="text-slate-200 antialiased h-screen flex flex-col overflow-hidden bg-sf-dark select-none">

  <!-- AUTH / LOGIN OVERLAY -->
  <section id="authSection" class="fixed inset-0 z-50 bg-[#0b0c10] flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-sm bg-[#13151a] rounded-3xl p-6 text-center shadow-2xl border border-slate-800/80">
      
      <!-- SchoolFriends Logo Badge -->
      <div class="w-20 h-20 bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 rounded-3xl flex items-center justify-center mx-auto mb-4 text-3xl font-black text-white shadow-xl shadow-indigo-600/30 tracking-wider border border-indigo-400/30">
        SF
      </div>

      <h2 class="text-2xl font-bold text-white mb-1">SchoolFriends</h2>
      <p class="text-xs text-slate-400 mb-6">Sign in with Google to connect with your classmates</p>
      
      <button id="googleSignInBtn" type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-3 transition duration-150 active:scale-95 shadow-lg shadow-indigo-600/25 cursor-pointer">
        <i class="fa-brands fa-google text-lg"></i>
        <span>Continue with Google</span>
      </button>
      
      <p id="authStatus" class="mt-4 text-xs text-amber-400 min-h-[1.25rem] font-medium leading-relaxed px-2"></p>
    </div>
  </section>

  <!-- MAIN APP WRAPPER -->
  <div id="mainAppSection" class="hidden flex-1 flex h-full w-full overflow-hidden relative">
    
    <!-- 1. LEFT ICON BAR -->
    <aside class="w-[68px] sm:w-[72px] bg-sf-dark flex flex-col items-center py-3 gap-3 shrink-0 border-r border-slate-800/60 z-30">
      <!-- Main Branding Logo -->
      <button class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white flex items-center justify-center text-lg font-black shadow-md transition-all hover:rounded-xl active:scale-95 border border-indigo-400/30">
        SF
      </button>

      <div class="w-8 h-[2px] bg-slate-800 rounded-full my-0.5"></div>

      <!-- Server / Direct Chat Icons List -->
      <div id="directChatList" class="flex-1 w-full flex flex-col items-center gap-2 overflow-y-auto no-scrollbar">
        <button onclick="switchChannel('general-lounge')" class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600 hover:text-white flex items-center justify-center font-black transition-all border border-indigo-500/30">
          #
        </button>
      </div>

      <!-- User Profile Avatar Trigger at Bottom -->
      <button id="openProfileBtn" class="relative group mt-auto cursor-pointer">
        <img id="userAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" class="w-11 h-11 rounded-full object-cover border-2 border-indigo-500 bg-slate-800 shadow" alt="Profile" />
        <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-sf-dark rounded-full"></span>
      </button>
    </aside>

    <!-- 2. MESSAGES / CHANNELS SIDEBAR (RESPONSIVE DRAWER ON MOBILE) -->
    <div id="channelSidebar" class="absolute md:relative inset-y-0 left-[68px] sm:left-[72px] md:left-0 z-20 w-72 bg-sf-sidebar flex flex-col shrink-0 border-r border-slate-800/60 transition-transform duration-200 shadow-2xl md:shadow-none">
      <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
        <h2 class="text-base font-bold text-white tracking-wide">Channels & DMs</h2>
        <button id="addFriendBtn" class="w-8 h-8 rounded-xl bg-slate-800/80 flex items-center justify-center text-xs text-indigo-400 hover:bg-indigo-600 hover:text-white transition">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <!-- Search Bar -->
      <div class="p-3">
        <div class="bg-sf-dark rounded-xl px-3 py-2 flex items-center gap-2 border border-slate-800">
          <i class="fa-solid fa-magnifying-glass text-slate-500 text-xs"></i>
          <input type="text" id="userSearchInput" placeholder="Search friends & channels..." class="bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none w-full" />
        </div>
      </div>

      <!-- Dynamic Channels Feed -->
      <div id="sidebarUserList" class="flex-1 overflow-y-auto chat-scroll px-2 space-y-1">
        <!-- Rendered by app.js -->
      </div>
    </div>

    <!-- 3. MAIN CHAT CONTAINER -->
    <main class="flex-1 flex flex-col h-full bg-sf-dark min-w-0 relative">
      
      <!-- Chat Header -->
      <header class="h-14 px-4 bg-sf-dark border-b border-slate-800/80 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
          <button id="toggleMenuBtn" class="md:hidden text-slate-400 hover:text-white text-lg p-1">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="flex items-center gap-2">
            <span class="text-indigo-400 font-bold text-lg">#</span>
            <span id="activeChannelTitle" class="text-sm font-bold text-white tracking-wide">general-lounge</span>
            <span class="inline-flex items-center gap-1 text-[10px] bg-emerald-500/10 text-emerald-400 font-semibold px-2 py-0.5 rounded-full border border-emerald-500/20 ml-2">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live
            </span>
          </div>
        </div>

        <div class="flex items-center gap-3 text-slate-400">
          <button id="ownerConsoleBtn" class="hidden text-emerald-400 hover:text-emerald-300 text-xs font-mono bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/30">
            <i class="fa-solid fa-terminal mr-1"></i> Admin
          </button>
          <button id="signOutBtn" class="hover:text-red-400 transition text-sm p-1" title="Sign Out">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <!-- Message Area -->
      <div id="chatBox" class="flex-1 overflow-y-auto chat-scroll p-4 space-y-4">
        <div class="flex flex-col items-center justify-center h-full text-slate-500 text-xs gap-2">
          <i class="fa-solid fa-circle-notch animate-spin text-lg text-indigo-400"></i>
          <span>Loading chat stream...</span>
        </div>
      </div>

      <!-- Image Attachment Preview Box -->
      <div id="imagePreviewContainer" class="hidden bg-sf-channel mx-3 my-1 rounded-xl p-2.5 flex items-center justify-between border border-indigo-500/30 shrink-0">
        <div class="flex items-center gap-3">
          <img id="imagePreview" class="w-12 h-12 rounded-lg object-cover border border-slate-700" alt="Attachment" />
          <div>
            <span class="text-xs font-medium text-slate-200 block">Image attached</span>
            <span class="text-[10px] text-slate-400">Ready to send</span>
          </div>
        </div>
        <button id="removeImageBtn" type="button" class="text-slate-400 hover:text-red-400 p-2 text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Input Bar -->
      <div class="p-3 bg-sf-dark shrink-0">
        <div class="bg-sf-input rounded-full p-1.5 flex items-center gap-1 shadow-lg border border-slate-800/80">
          
          <label class="w-9 h-9 rounded-full bg-slate-700/50 hover:bg-slate-700 text-slate-300 flex items-center justify-center cursor-pointer transition shrink-0">
            <i class="fa-solid fa-plus text-sm"></i>
            <input type="file" id="imageInput" accept="image/*" class="hidden" />
          </label>

          <input 
            type="text" 
            id="messageInput" 
            placeholder="Type a message..." 
            class="flex-1 bg-transparent text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none px-2"
            maxlength="340"
          />

          <button id="sendBtn" type="button" class="w-9 h-9 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition shrink-0 shadow-md active:scale-95 cursor-pointer">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </div>
      </div>

    </main>
  </div>

  <!-- 4. PROFILE MODAL -->
  <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="w-full sm:max-w-md bg-sf-sidebar rounded-t-3xl sm:rounded-2xl overflow-hidden shadow-2xl border border-slate-800 transform transition-all">
      <div class="h-28 bg-gradient-to-r from-indigo-600 to-violet-600 relative">
        <button id="closeProfileBtn" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/40 text-white flex items-center justify-center hover:bg-black/60 transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="px-5 pb-5 relative">
        <div class="flex justify-between items-end -mt-12 mb-3">
          <div class="relative">
            <img id="modalProfileAvatar" src="https://via.placeholder.com/80" class="w-20 h-20 rounded-full border-4 border-sf-sidebar bg-slate-800 object-cover" alt="Profile" />
            <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-sf-sidebar rounded-full"></span>
          </div>
        </div>

        <h3 id="modalProfileName" class="text-lg font-bold text-white leading-tight">Student Name</h3>
        <p id="modalProfileTag" class="text-xs text-indigo-400 mb-3">@student</p>

        <div class="bg-sf-dark rounded-xl p-3.5 border border-slate-800/80 space-y-2">
          <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Account Details</h4>
          <p id="modalProfileBio" class="text-xs text-slate-300 leading-relaxed">
            SchoolFriends Campus Member
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. OWNER TERMINAL MODAL -->
  <div id="consoleModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="w-full max-w-xl bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-2xl flex flex-col h-[28rem]">
      <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2 text-emerald-400 font-mono text-xs font-bold tracking-wider">
          <i class="fa-solid fa-terminal"></i>
          <span>ADMIN CONSOLE</span>
        </div>
        <button id="closeConsoleBtn" class="text-slate-400 hover:text-white text-sm transition"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="consoleOutput" class="flex-1 bg-slate-900/90 rounded-xl p-3.5 font-mono text-xs text-emerald-400 overflow-y-auto whitespace-pre-wrap mb-3 border border-slate-800/80 leading-relaxed">
Welcome Owner!
      </div>

      <div class="flex items-center gap-2 bg-slate-900 rounded-xl p-2.5 border border-slate-800">
        <span class="text-emerald-400 font-mono text-xs pl-2">&gt;</span>
        <input type="text" id="consoleInput" placeholder="Enter command..." class="flex-1 bg-transparent text-xs font-mono text-slate-100 focus:outline-none" />
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=20261003-1"></script>
</body>
    </html>
