<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Viewport Fixes & Soft Keyboard Resize Listener -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" 
    />

    <title>SchoolFriends | SocialChat</title>

    <meta name="theme-color" content="#313338" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
      :root {
        --app-height: 100dvh;
      }

      /* Base Layout Reset */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: var(--app-height);
        overscroll-behavior-y: none;
        overflow: hidden;
        background-color: #313338;
        color: #dbdee1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Prevent iOS Safari auto-zoom bug on input focus (Must be >= 16px) */
      input, textarea, select {
        font-size: 16px !important;
      }

      /* Smooth scrolling container */
      .scroll-container {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }
    </style>
  </head>
  <body class="bg-[#313338] text-[#dbdee1]">
    <div id="root"></div>

    <!-- Soft Keyboard Dynamic Height Fixer -->
    <script>
      function setAppHeight() {
        const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', `${height}px`);
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppHeight);
        window.visualViewport.addEventListener('scroll', setAppHeight);
      } else {
        window.addEventListener('resize', setAppHeight);
      }

      setAppHeight();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
