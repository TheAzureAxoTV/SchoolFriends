<!DOCTYPE html>
<html lang="en" class="h-full bg-[#1e1f22] text-[#dbdee1]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SchoolFriends Chat</title>
  <link rel="shortcut icon" href="logo10_3_13369.png" type="image/png" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#5865f2',
            'brand-hover': '#4752c4',
            dark: {
              100: '#383a40',
              200: '#313338',
              300: '#2b2d31',
              400: '#1e1f22',
              500: '#111214'
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #111214; }
  </style>
</head>
<body class="h-full flex overflow-hidden font-sans antialiased select-none bg-dark-400">

  <!-- OVERLAY FOR MOBILE SIDEBAR -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-30 hidden sm:hidden transition-opacity"></div>

  <!-- 1. LEFT SERVER RAIL -->
  <aside class="w-[72px] bg-dark-400 flex flex-col items-center py-3 gap-2 shrink-0 border-r border-dark-300 z-50">
    <div class="relative group cursor-pointer">
      <div class="absolute -left-3 top-2.5 w-1 h-8 bg-brand rounded-r-full"></div>
      <img src="logo10_3_13369.png" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] object-cover transition-all duration-200 border border-brand/30 shadow-lg" alt="Server Logo" />
    </div>
    
    <div class="w-8 h-[2px] bg-dark-100 rounded-full my-1"></div>

    <button class="w-12 h-12 rounded-[24px] bg-dark-200 hover:bg-brand hover:rounded-[16px] flex items-center justify-center text-[#23a55a] hover:text-white transition-all duration-200 cursor-pointer group shadow-sm">
      <i class="fa-solid fa-plus text-lg group-hover:scale-110 transition-transform"></i>
    </button>
  </aside>

  <!-- 2. CHANNEL SIDEBAR (RESPONSIVE DRAWER) -->
  <aside id="channelSidebar" class="fixed sm:relative inset-y-0 left-[72px] sm:left-0 w-64 bg-dark-300 flex flex-col shrink-0 border-r border-dark-400 z-40 transform -translate-x-full sm:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl sm:shadow-none">
    
    <!-- Server Header -->
    <header class="h-12 px-4 flex items-center justify-between border-b border-dark-400 shadow-sm shrink-0">
      <h1 class="font-bold text-white text-sm tracking-wide flex items-center gap-2">
        <span>SchoolFriends</span>
        <i class="fa-solid fa-circle-check text-xs text-brand"></i>
      </h1>
      <i class="fa-solid fa-chevron-down text-xs text-[#949ba4]"></i>
    </header>

    <!-- Channel List -->
    <div class="flex-1 overflow-y-auto p-2 space-y-1" id="channelList">
      <div class="px-2 pt-3 pb-1 text-[11px] font-bold tracking-wider text-[#949ba4] uppercase">Text Channels</div>
      
      <button data-channel="general-chat" class="channel-btn w-full flex items-center gap-2 px-2.5 py-2 rounded-md bg-dark-100/80 text-white font-medium text-xs transition active:scale-[0.98]">
        <i class="fa-solid fa-hashtag text-[#80848e] text-sm"></i>
        <span class="truncate">general-chat</span>
      </button>

      <button data-channel="announcements" class="channel-btn w-full flex items-center gap-2 px-2.5 py-2 rounded-md hover:bg-dark-100/40 text-[#949ba4] hover:text-[#dbdee1] font-medium text-xs transition active:scale-[0.98]">
        <i class="fa-solid fa-bullhorn text-[#80848e] text-sm"></i>
        <span class="truncate">announcements</span>
      </button>

      <button data-channel="polls" class="channel-btn w-full flex items-center gap-2 px-2.5 py-2 rounded-md hover:bg-dark-100/40 text-[#949ba4] hover:text-[#dbdee1] font-medium text-xs transition active:scale-[0.98]">
        <i class="fa-solid fa-square-poll-vertical text-[#80848e] text-sm"></i>
        <span class="truncate">polls</span>
      </button>
    </div>

    <!-- User Profile Footer -->
    <footer class="h-14 bg-dark-500/80 px-3 flex items-center justify-between border-t border-dark-400/50 shrink-0">
      <div class="flex items-center gap-2.5 overflow-hidden">
        <div class="relative shrink-0">
          <img id="userAvatar" src="logo10_3_1188.png" class="w-8 h-8 rounded-full object-cover bg-dark-200 border border-dark-100" alt="Profile" />
          <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-[#23a55a] rounded-full border-2 border-dark-500"></div>
        </div>
        <div class="flex flex-col truncate">
          <span id="userName" class="text-xs font-bold text-white truncate">User</span>
          <span class="text-[10px] text-[#949ba4] truncate font-medium">Online</span>
        </div>
      </div>
      <button id="logoutBtn" class="text-[#949ba4] hover:text-rose-400 p-2 transition cursor-pointer" title="Log Out">
        <i class="fa-solid fa-right-from-bracket text-sm"></i>
      </button>
    </footer>
  </aside>

  <!-- 3. MAIN CHAT AREA -->
  <main class="flex-1 flex flex-col bg-dark-200 min-w-0 relative">
    
    <!-- Top Header Bar -->
    <header class="h-12 px-4 flex items-center justify-between border-b border-dark-400 bg-dark-200 shrink-0 z-10 shadow-sm">
      <div class="flex items-center gap-3 min-w-0">
        <button id="toggleMenuBtn" class="sm:hidden text-[#949ba4] hover:text-white transition">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div class="flex items-center gap-2 min-w-0">
          <i class="fa-solid fa-hashtag text-[#80848e] text-base"></i>
          <span id="currentChannelTitle" class="font-bold text-white text-sm truncate">general-chat</span>
        </div>
      </div>
      <div class="flex items-center gap-4 text-[#b5bac1] text-sm">
        <i class="fa-solid fa-bell hover:text-white transition cursor-pointer"></i>
        <i class="fa-solid fa-users hover:text-white transition cursor-pointer"></i>
      </div>
    </header>

    <!-- Scrollable Chat Messages Container -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- Dynamic Messages Rendered Here -->
    </div>

    <!-- Bottom Message Input Bar -->
    <div class="p-3 sm:p-4 bg-dark-200 shrink-0 border-t border-dark-400/40">
      <form id="messageForm" class="relative w-full rounded-xl flex items-center px-3 py-1.5 gap-2.5 bg-dark-100 focus-within:ring-2 focus-within:ring-brand/50 transition-all shadow-inner">
        
        <!-- Upload Attachment Button -->
        <label class="w-7 h-7 rounded-full bg-[#4e5058] hover:bg-[#6d6f78] flex items-center justify-center cursor-pointer transition shrink-0 shadow-sm active:scale-95" title="Attach Media">
          <i class="fa-solid fa-plus text-[#dbdee1] text-xs"></i>
          <input type="file" id="imageInput" accept="image/*" class="hidden" />
        </label>

        <!-- Message Input -->
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Message #general-chat" 
          class="flex-1 bg-transparent text-[#dbdee1] placeholder-[#80848e] focus:outline-none text-sm font-normal py-1"
          maxlength="500"
          autocomplete="off"
        />

        <!-- Actions -->
        <div class="flex items-center gap-2.5 shrink-0 text-[#b5bac1]">
          <button id="sendBtn" type="submit" class="w-8 h-8 rounded-lg bg-brand hover:bg-brand-hover text-white flex items-center justify-center transition cursor-pointer shadow-sm active:scale-95">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </div>

      </form>
    </div>

  </main>

  <script type="module" src="app.js"></script>
</body>
  </html>
