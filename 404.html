<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SchoolFriends</title>
  <script>
    // GitHub Pages SPA fallback.
    // Send the visitor to the repository root instead of showing GitHub's
    // generic 404 page. This is especially useful for custom domains.
    (function () {
      var base = "/SchoolFriends/";
      var host = location.hostname;
      // For a project page, use /SchoolFriends/. For a custom domain or
      // user.github.io site, use the root.
      if (host.endsWith(".github.io") && !host.includes("github.com")) {
        base = location.pathname.indexOf("/SchoolFriends/") >= 0
          ? "/SchoolFriends/"
          : "/";
      } else if (host !== "localhost" && !host.endsWith(".github.io")) {
        base = "/";
      }
      location.replace(base);
    })();
  </script>
</head>
<body style="margin:0;background:#1e1f22;color:#dbdee1;font-family:Arial,sans-serif;display:grid;place-items:center;height:100vh">
  <div style="text-align:center;padding:24px">
    <h2>Opening SchoolFriends…</h2>
    <p style="color:#949ba4">Redirecting to the app.</p>
  </div>
</body>
</html>
